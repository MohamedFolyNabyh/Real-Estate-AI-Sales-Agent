services:

  # =========================================================
  # PostgreSQL
  # =========================================================

  postgres:
    image: postgres:16

    container_name: real_estate_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate_user
      POSTGRES_PASSWORD: real_estate_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U real_estate_user -d real_estate"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================================================
  # FastAPI Backend
  # =========================================================

  backend:
    image: mohamedfoly12/real-estate-ai-sales-agent:latest

    container_name: real_estate_backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    command:
      uvicorn api.main:app --host 0.0.0.0 --port 8000


  # =========================================================
  # Streamlit Frontend
  # =========================================================

  frontend:
    image: mohamedfoly12/real-estate-ai-sales-agent:latest

    container_name: real_estate_frontend

    restart: unless-stopped

    environment:
      API_URL: http://backend:8000

    depends_on:
      - backend

    ports:
      - "8501:8501"

    command:
      streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501


# =========================================================
# Volumes
# =========================================================

volumes:

  postgres_data: