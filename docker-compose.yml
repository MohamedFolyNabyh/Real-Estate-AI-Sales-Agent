services:

  postgres:
    image: postgres:16
    container_name: real_estate_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate_user
      POSTGRES_PASSWORD: real_estate_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: